<!DOCTYPE html>

  <!-- Favicon -->

  <!-- Non-critical: Material Symbols (icons, loaded async) -->

<body>

  <!-- ============================================================

      <a href="index.html" class="navbar__logo">Federico Iseas</a>

          <span></span>
          <span></span>
          <span></span>

    <div class="navbar__mobile-actions">
      <a href="resources/docs/CV_Iseas_Federico.pdf" target="_blank" rel="noopener noreferrer" class="btn btn--primary btn--small">
        <span class="material-symbols-rounded">download</span>
        <span data-i18n="nav.cv">Descargar CV</span>

      </div>

        <!-- Rendered dynamically by main.js -->
      </div>

       ============================================================ -->

      <p class="footer__text" id="footer-copy"></p>
    </div>

  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
